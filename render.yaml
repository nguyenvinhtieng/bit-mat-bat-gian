services:
  - type: web
    name: giao-keo
    runtime: node
    plan: free
    region: singapore
    # Do not set NODE_ENV=production here: pnpm would skip devDependencies (tsx, vite, typescript) needed to build/run.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Cloudflare TURN for voice — secrets, set in the Render dashboard (sync: false = never in git)
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
