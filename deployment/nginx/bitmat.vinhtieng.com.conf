# Production: https://bitmat.vinhtieng.com (TLS terminates at Cloudflare — origin HTTP only)
#
# Cloudflare: A record → VPS IP, proxy ON (orange cloud).
# SSL/TLS mode: Flexible (CF→origin :80) or Full with Origin Certificate on origin if you add TLS later.
# Network: WebSockets enabled.
#
# Install:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deployment/nginx/cloudflare-real-ip.conf /etc/nginx/snippets/
#   sudo cp deployment/nginx/bitmat.vinhtieng.com.conf /etc/nginx/sites-available/bitmat.vinhtieng.com
#   sudo ln -sf /etc/nginx/sites-available/bitmat.vinhtieng.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
include /etc/nginx/snippets/cloudflare-real-ip.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream hidden_truth_app {
    server 127.0.0.1:2567;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitmat.vinhtieng.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://hidden_truth_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /health {
        proxy_pass http://hidden_truth_app/health;
        access_log off;
    }
}
